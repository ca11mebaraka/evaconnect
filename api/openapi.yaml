        deactivatedStatusText:
          type: string
        iconActivated:
          type: string
        iconDeactivated:
          type: string

    TelemetrySensors:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/SensorValue"
      description: Keys observed 2026-09-02 on i-SPACE. Not a closed set.
      properties:
        batteryPercentage:
          $ref: "#/components/schemas/SensorValue"
        remainsBatteryMileage:
          $ref: "#/components/schemas/SensorValue"
        batteryTemp:
          $ref: "#/components/schemas/SensorValue"
        "12VBatteryVoltage":
          $ref: "#/components/schemas/SensorValue"
        isChargingGunInserted:
          $ref: "#/components/schemas/SensorValue"
        climateTargetTemp:
          $ref: "#/components/schemas/SensorValue"
        climateFanSpeed:
          $ref: "#/components/schemas/SensorValue"
        inBoardTemp:
          $ref: "#/components/schemas/SensorValue"
        outsideTemp:
          $ref: "#/components/schemas/SensorValue"
        coolantTemp:
          $ref: "#/components/schemas/SensorValue"
        isCentralLockingOn:
          $ref: "#/components/schemas/SensorValue"
        doorFLStatus:
          $ref: "#/components/schemas/SensorValue"
        doorFRStatus:
          $ref: "#/components/schemas/SensorValue"
        doorRLStatus:
          $ref: "#/components/schemas/SensorValue"
        doorRRStatus:
          $ref: "#/components/schemas/SensorValue"
        trunkStatus:
          $ref: "#/components/schemas/SensorValue"
        headLightsStatus:
          $ref: "#/components/schemas/SensorValue"
        isIgnitionOn:
          $ref: "#/components/schemas/SensorValue"
        isParkedOn:
          $ref: "#/components/schemas/SensorValue"
        odometer:
          $ref: "#/components/schemas/SensorValue"
        signalLevel:
          $ref: "#/components/schemas/SensorValue"
        lat:
          $ref: "#/components/schemas/SensorValue"
        lon:
          $ref: "#/components/schemas/SensorValue"
        course:
          $ref: "#/components/schemas/SensorValue"
        firmwareVersion:
          $ref: "#/components/schemas/SensorValue"
        settingsVersion:
          $ref: "#/components/schemas/SensorValue"
        fuelPercentage:
          $ref: "#/components/schemas/SensorValue"
        remainsFuelMileage:
          $ref: "#/components/schemas/SensorValue"
        isOnline:
          $ref: "#/components/schemas/SensorValue"

    Telemetry:
      type: object
      additionalProperties: true
      properties:
        isOnline:
          type: boolean
        onlineState:
          type: string
          examples: [connected, notFound]
        isCarStateReady:
          type: boolean
        carStateUpdatedAt:
          type: [integer, "null"]
        sensors:
          $ref: "#/components/schemas/TelemetrySensors"
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryButton"
        automations:
          type: array
          items: true
        warnings:
          type: array
          items: true
        firmwareCheck: {}
        settingsCheck: {}

    ChargeSession:
      type: object
      additionalProperties: true
      description: Non-empty 200 body not captured live.

    TripSort:
      type: object
      additionalProperties: true
      required: [by, dir]
      properties:
        by:
          type: string
          enum: [DATE, DURATION, DISTANCE]
        dir:
          type: string
          enum: [ASC, DESC]

    TripSearchRequest:
      type: object
      additionalProperties: true
      properties:
        sort:
          $ref: "#/components/schemas/TripSort"
        filters:
          type: array
          items:
            type: object
            additionalProperties: true
        limit:
          type: integer
        offset:
          type: integer

    TripFilter:
      type: object
      additionalProperties: true
      properties:
        key:
          type: string
        type:
          type: string
        name:
          type: string
        options:
          type: array
          items: true

    TripSummary:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id:
          type: integer
        segmentStartTime:
          type: integer
          description: Unix seconds. Required as startTime on details.
        segmentEndTime:
          type: integer
        startDate:
          type: [integer, "null"]
          description: Unix milliseconds. Aligns with `title` UTC clock.
        endDate:
          type: [integer, "null"]
        title:
          type: [string, "null"]
        description:
          type: [string, "null"]
        duration:
          type: string
        distance:
          type: integer
          description: Raw integer. Unit not established.
        batteryConsumption:
          type: [integer, "null"]
        odometer:
          $ref: "#/components/schemas/FirstLast"
        battery:
          $ref: "#/components/schemas/FirstLast"
        fuel:
          $ref: "#/components/schemas/FirstLast"

    TripPage:
      type: object
      additionalProperties: true
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TripSummary"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        filters: {}

    TripPoint:
      type: object
      additionalProperties: true
      properties:
        lat:
          type: number
        lon:
          type: number
        time:
          description: Unix milliseconds in the 2026-09-02 capture
          type: [integer, string]

    TripDetails:
      allOf:
        - $ref: "#/components/schemas/TripSummary"
        - type: object
          additionalProperties: true
          properties:
            startAddr:
              type: string
            endAddr:
              type: string
            pointsTotal:
              type: integer
            points:
              type: array
              items:
                $ref: "#/components/schemas/TripPoint"

    FeatureFlags:
      type: object
      additionalProperties: true
      description: Success body not captured live.
      properties:
        flags:
          type: object
          additionalProperties: true
